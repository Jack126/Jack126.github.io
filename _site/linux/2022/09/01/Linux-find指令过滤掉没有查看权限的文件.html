  <h1>Linux find指令过滤掉没有查看权限的文件</h1>

  <p>如题，find指令寻找某个文件时，
如果，
find 路径 -name 文件名
通常会列出很多无权限查看文件，
事实上这些文件也不是我们要找的，
有时候占了很多篇幅影响视线。</p>
<div class="language-plaintext highlighter-rouge"><div class="highlight"><pre class="highlight"><code>find 路径 -name 文件名 2&gt;/dev/null
</code></pre></div></div>
<p>就能过滤掉，
也就是说，后面加了：</p>
<div class="language-plaintext highlighter-rouge"><div class="highlight"><pre class="highlight"><code>2&gt;/dev/null
</code></pre></div></div>
<p>记录用，如有侵，告之必删</p>
