lass="line">63</span><br><span class="line">64</span><br><span class="line">65</span><br><span class="line">66</span><br><span class="line">67</span><br><span class="line">68</span><br><span class="line">69</span><br><span class="line">70</span><br><span class="line">71</span><br><span class="line">72</span><br><span class="line">73</span><br><span class="line">74</span><br><span class="line">75</span><br><span class="line">76</span><br><span class="line">77</span><br><span class="line">78</span><br><span class="line">79</span><br><span class="line">80</span><br><span class="line">81</span><br><span class="line">82</span><br><span class="line">83</span><br><span class="line">84</span><br><span class="line">85</span><br><span class="line">86</span><br><span class="line">87</span><br><span class="line">88</span><br><span class="line">89</span><br><span class="line">90</span><br><span class="line">91</span><br><span class="line">92</span><br><span class="line">93</span><br><span class="line">94</span><br><span class="line">95</span><br><span class="line">96</span><br><span class="line">97</span><br><span class="line">98</span><br><span class="line">99</span><br><span class="line">100</span><br><span class="line">101</span><br><span class="line">102</span><br><span class="line">103</span><br><span class="line">104</span><br><span class="line">105</span><br><span class="line">106</span><br><span class="line">107</span><br><span class="line">108</span><br><span class="line">109</span><br><span class="line">110</span><br><span class="line">111</span><br><span class="line">112</span><br><span class="line">113</span><br><span class="line">114</span><br></pre></td><td class="code"><pre><span class="line">syntax on                      &quot; 语法高亮</span><br><span class="line">filetype on</span><br><span class="line">filetype plugin on</span><br><span class="line">filetype plugin indent on      &quot; 开启自动识别文件类型,并根据文件类型加载不同的插件和缩进规则</span><br><span class="line">set number                     &quot; 显示行号</span><br><span class="line">set relativenumber             &quot; 显示相对行号</span><br><span class="line">set autoindent</span><br><span class="line">set smartindent</span><br><span class="line">set softtabstop=4</span><br><span class="line">set shiftwidth=4               &quot; 设置位移宽度为4</span><br><span class="line">set tabstop=4                  &quot; 设置缩进宽度为4</span><br><span class="line">set expandtab                  &quot; 将缩进替换为空格</span><br><span class="line">set nobackup                   &quot; 不生成backup文件</span><br><span class="line">set scrolloff=10               &quot; 设置滚动时始终显示上下10行</span><br><span class="line">set nowrap                     &quot; 禁止折行</span><br><span class="line">set incsearch                  &quot; 增量式搜索</span><br><span class="line">set ignorecase                 &quot; 搜索时大小写不敏感</span><br><span class="line">set smartcase                  &quot; 搜索时对首字母大小写敏感</span><br><span class="line">set showcmd                    &quot; 显示键入的命令前缀</span><br><span class="line">set showmode                   &quot; 显示当前模式(插入、可视等)</span><br><span class="line">set hlsearch                   &quot; 高亮搜索结果</span><br><span class="line">set history=1000               &quot; 设置命令历史记录为1000</span><br><span class="line">set wildmenu                   &quot; 设置tab补全</span><br><span class="line">set wildmode=list:longest      &quot; 使tab补全类似于Bash</span><br><span class="line">set encoding=utf-8             &quot; 设置编码方式为UTF-8</span><br><span class="line">set showmatch                  &quot; 当光标置于成对符号(例如括号)时,高亮匹配的符号对</span><br><span class="line">exec &quot;nohlsearch&quot;</span><br><span class="line">set mouse=a                    &quot; 支持鼠标</span><br><span class="line">set foldmethod=indent          &quot; 代码折叠</span><br><span class="line">set foldcolumn=0               &quot; 设置代码区域的宽度</span><br><span class="line">setlocal foldlevel=1           &quot; 设置折叠层数为</span><br><span class="line">set foldlevelstart=99          &quot; 打开文件是默认不折叠代码</span><br><span class="line">set cursorline                 &quot; 光标所在的当前行高亮</span><br><span class="line">set cursorcolumn               &quot; 高亮当前列</span><br><span class="line"></span><br><span class="line"></span><br><span class="line"></span><br><span class="line">let g:mapleader = &quot; &quot;                   &quot; leader 改为空格</span><br><span class="line"></span><br><span class="line">cmap w!! w !sudo tee &gt;/dev/null %       &quot; w!!写入只读文件</span><br><span class="line"></span><br><span class="line">map tq :tabclose                        &quot; 标签页操作  关闭标签页 tabe close</span><br><span class="line">map tmh :-tabmove                       &quot; 移动标签页 tabe move h/j</span><br><span class="line">map tml :+tabmove</span><br><span class="line"></span><br><span class="line">noremap ta :tabe&lt;CR&gt;                    &quot; ta 为新建标签页,th 和 tl 分别向左右跳转</span><br><span class="line">noremap th :-tabnext&lt;CR&gt;</span><br><span class="line">noremap tl :+tabnext&lt;CR&gt;</span><br><span class="line"></span><br><span class="line">let &amp;t_SI = &quot;\]50;CursorShape=1\x7&quot;     &quot; 根据不同模式,改变光标样式</span><br><span class="line">let &amp;t_SR = &quot;\]50;CursorShape=2\x7&quot;</span><br><span class="line">let &amp;t_EI = &quot;\]50;CursorShape=0\x7&quot;</span><br><span class="line"></span><br><span class="line">noremap j gj</span><br><span class="line">noremap k gk</span><br><span class="line">noremap gj j</span><br><span class="line">noremap gk k</span><br><span class="line">noremap J 5gj</span><br><span class="line">noremap K 5gk</span><br><span class="line"></span><br><span class="line">noremap &lt;leader&gt;&lt;CR&gt; :nohlsearch&lt;CR&gt;    &quot; 取消高亮映射 空格(&lt;leader&gt;)和回车(&lt;CR&gt;)</span><br><span class="line"></span><br><span class="line">noremap s &lt;nop&gt;                         &quot; 分屏(split)</span><br><span class="line">noremap sl :set splitright&lt;CR&gt;:vsplit&lt;CR&gt;</span><br><span class="line">noremap sh :set nosplitright&lt;CR&gt;:vsplit&lt;CR&gt;</span><br><span class="line">noremap sj :set splitbelow&lt;CR&gt;:split&lt;CR&gt;</span><br><span class="line">noremap sk :set nosplitbelow&lt;CR&gt;:split&lt;CR&gt;</span><br><span class="line"></span><br><span class="line">noremap &lt;leader&gt;l &lt;c-w&gt;l                &quot; 使用空格加方向键实现分屏之间的跳转</span><br><span class="line">noremap &lt;leader&gt;h &lt;c-w&gt;h</span><br><span class="line">noremap &lt;leader&gt;j &lt;c-w&gt;j</span><br><span class="line">noremap &lt;leader&gt;k &lt;c-w&gt;k</span><br><span class="line"></span><br><span class="line">noremap &lt;leader&gt;L &lt;c-w&gt;L                &quot; 使用空格加大写方向键将当前分屏放置到指定方向的最边缘</span><br><span class="line">noremap &lt;leader&gt;H &lt;c-w&gt;H</span><br><span class="line">noremap &lt;leader&gt;J &lt;c-w&gt;J</span><br><span class="line">noremap &lt;leader&gt;K &lt;c-w&gt;K</span><br><span class="line"></span><br><span class="line">noremap &lt;up&gt; :res +5&lt;CR&gt;                &quot; 上下左右键调整当前分屏的高度和宽度</span><br><span class="line">noremap &lt;down&gt; :res -5&lt;CR&gt;</span><br><span class="line">noremap &lt;left&gt; :vertical res -5&lt;CR&gt;</span><br><span class="line">noremap &lt;right&gt; :vertical res +5&lt;CR&gt;</span><br><span class="line"></span><br><span class="line">noremap &lt;leader&gt;o o&lt;Esc&gt;k               &quot; 空格加小写字母 o:向下插入空行</span><br><span class="line">noremap &lt;leader&gt;O O&lt;Esc&gt;j               &quot; 空格加大写字母 O:向上插入空行</span><br><span class="line">noremap &lt;leader&gt;w :w&lt;CR&gt;                &quot; 空格加小写字母 w:保存文档</span><br><span class="line">noremap &lt;leader&gt;q :q&lt;CR&gt;                &quot; 空格加小写字母 q:退出 Neovim</span><br><span class="line">noremap Y &quot;+y                           &quot; 大写字母 Y:复制到系统剪切板</span><br><span class="line"></span><br><span class="line">noremap = nzz                           &quot; 查找 zz 可以将当前行居中,继续查找设置为更常用(输入法常用)的 = 和 - 键:</span><br><span class="line">noremap - Nzz</span><br><span class="line"></span><br><span class="line">nnoremap R :source $MYVIMRC&lt;CR&gt;         &quot; 普通模式下大写字母 R:刷新 Neovim 配置</span><br><span class="line">&quot;0 和 $ 默认情况下分别表示实际行的行首和行尾</span><br><span class="line">nnoremap g0 0</span><br><span class="line">nnoremap 0 g0</span><br><span class="line">nnoremap $ g$</span><br><span class="line">nnoremap g$ $</span><br><span class="line"></span><br><span class="line">silent !mkdir -p ~/.config/nvim/tmp/backup   &quot; 编辑 保留记录,退出后再次打开依然可以 undo</span><br><span class="line">silent !mkdir -p ~/.config/nvim/tmp/undo</span><br><span class="line">set backupdir=~/.config/nvim/tmp/backup,.</span><br><span class="line">set directory=~/.config/nvim/tmp/backup,.</span><br><span class="line">if has(&#x27;persistent_undo&#x27;)</span><br><span class="line">  set undofile</span><br><span class="line">  set undodir=~/.config/nvim/tmp/undo,.</span><br><span class="line">endif</span><br><span class="line"></span><br><span class="line">noremap &lt;leader&gt;e  :Explore&lt;CR&gt;              &quot; 当前窗口下打开</span><br><span class="line">noremap &lt;leader&gt;ve :Vexplore&lt;CR&gt;             &quot; 竖直分割窗口打开</span><br><span class="line">noremap &lt;leader&gt;se :Sexplore&lt;CR&gt;             &quot; 水平分割窗口打开</span><br><span class="line"></span><br><span class="line">au BufReadPost * if line(&quot;&#x27;\&quot;&quot;) &gt; 1 &amp;&amp; line(&quot;&#x27;\&quot;&quot;) &lt;= line(&quot;$&quot;) | exe &quot;normal! g&#x27;\&quot;&quot; | endif  &quot; 恢复光标</span><br><span class="line"></span><br></pre></td></tr></table></figure></div><footer class="post-footer"><div class="post-categories"><span class="meta-label">分类: </span><a href="/categories/%E7%BC%96%E8%BE%91%E5%99%A8/" class="category">编辑器</a></div><div class="post-tags"><span class="meta-label">标签: </span><a href="/tags/neovim/" class="tag">neovim</a></div></footer><nav class="post-nav"><div class="post-nav-item prev"><span class="post-nav-label">&larr; 上一页</span> <a href="/2022/10/24/2022-10-24-MySQL%20%E6%97%
